<mat-card class="welcome-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>widgets</mat-icon>
    <mat-card-title>Bem-vindo ao A2UI</mat-card-title>
    <mat-card-subtitle>Angular 17 + Angular Material</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>
      Estrutura base do monorepo pronta. O frontend usa Angular 17 com o Design
      System do Angular Material. O backend em Python está preparado com a
      estrutura inicial.
    </p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button color="primary">
      <mat-icon>rocket_launch</mat-icon>
      Começar
    </button>
    <button mat-stroked-button>Documentação</button>
  </mat-card-actions>
</mat-card>
