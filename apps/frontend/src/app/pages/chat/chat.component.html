<section class="chat">
  <div class="chat-messages" aria-live="polite">
    @for (message of messages(); track $index) {
      <div
        class="bubble"
        [class.bubble-user]="message.role === 'user'"
        [class.bubble-assistant]="message.role === 'assistant'"
      >
        @if (message.content) {
          {{ message.content }}
        } @else if (message.role === 'assistant' && isStreaming()) {
          <mat-spinner diameter="20"></mat-spinner>
        }
      </div>
    }
    <div #scrollAnchor class="scroll-anchor"></div>
  </div>

  @if (error()) {
    <p class="chat-error" role="alert">{{ error() }}</p>
  }

  <form class="chat-input" (ngSubmit)="send()">
    <mat-form-field class="chat-field" appearance="outline">
      <mat-label>Mensagem</mat-label>
      <textarea
        matInput
        name="message"
        rows="2"
        [(ngModel)]="userInput"
        [disabled]="isStreaming()"
        placeholder="Pergunte algo ao assistente..."
      ></textarea>
    </mat-form-field>

    <button
      mat-fab
      color="primary"
      type="submit"
      aria-label="Enviar mensagem"
      [disabled]="isStreaming() || !userInput.trim()"
    >
      <mat-icon>send</mat-icon>
    </button>
  </form>
</section>
